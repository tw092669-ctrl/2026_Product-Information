name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Create environment file
        run: |
          cat > .env.local << 'EOF'
          GEMINI_API_KEY=default-key
          APP_URL=https://tw092669-ctrl.github.io/2026_Product-Information/
          EOF
          echo "✓ Environment file created"
      
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit

      - name: Check Vite installation
        run: |
          echo "Checking Vite..."
          npx vite --version
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          
      - name: Debug Node and npm
        run: |
          echo "Node version:"
          node --version
          echo "npm version:"
          npm --version
          echo "npm list (top level):"
          npm list --depth=0
      
      - name: Build project
        run: npm run build 2>&1 || (echo "=== BUILD FAILED ===" && ls -la && npm list --depth=0 && exit 1)
      
      - name: Verify build output
        run: |
          echo "Build output:"
          ls -lah dist/
          echo ""
          echo "HTML content check:"
          head -20 dist/index.html

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
      
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4

